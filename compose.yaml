name: w-suqi

services:
  suqi:
    image: ${SUQI_IMAGE:?set SUQI_IMAGE to the verified project image digest}
    container_name: w-suqi
    network_mode: host
    volumes:
      - type: bind
        source: /data1/weifeng/suqi
        target: /data/suqi
        read_only: true
        bind:
          create_host_path: false
    environment:
      HOST: ${SUQI_BIND_IP:?set SUQI_BIND_IP to the test server's private IP}
      PORT: "5001"
      QWEN_CHAT_COMPLETIONS_URL: ${QWEN_CHAT_COMPLETIONS_URL:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.8-27b}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
